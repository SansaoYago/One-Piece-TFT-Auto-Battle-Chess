<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Piece Tactics - Launcher</title>
    <style>
      :root { color-scheme: dark; font-family: Segoe UI, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #273449, #090d14 68%); color: #f8fafc; }
      main { width: 100%; max-width: 420px; padding: 32px; text-align: center; }
      .mark { margin: 0 auto 18px; width: 72px; height: 72px; display: grid; place-items: center; border: 2px solid #f59e0b; border-radius: 20px; color: #fbbf24; font-size: 34px; box-shadow: 0 0 32px #f59e0b55; }
      h1 { margin: 0; font-size: 25px; letter-spacing: .04em; }
      p { min-height: 42px; margin: 12px 0 22px; color: #94a3b8; font-size: 13px; line-height: 1.5; }
      progress { width: 100%; height: 8px; accent-color: #f59e0b; }
      button { width: 100%; padding: 12px 18px; border: 0; border-radius: 10px; background: #f59e0b; color: #111827; font-weight: 800; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .45; }
      small { display: block; margin-top: 14px; color: #64748b; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">⚓</div>
      <h1>One Piece Tactics</h1>
      <p id="status">Verificando atualizações...</p>
      <progress id="progress" value="0" max="100" hidden></progress>
      <button id="action" disabled>Verificando...</button>
      <small id="version"></small>
    </main>
    <script>
      const status = document.getElementById('status');
      const action = document.getElementById('action');
      const progress = document.getElementById('progress');
      const version = document.getElementById('version');

      function setReady(text) {
        status.textContent = text;
        action.textContent = 'Entrar no jogo';
        action.disabled = false;
        action.onclick = () => window.launcherApi.launch();
        progress.hidden = true;
      }

      window.launcherApi.onStatus((payload) => {
        if (payload.version) version.textContent = `Versão ${payload.version}`;
        if (payload.status === 'checking') status.textContent = 'Verificando atualizações...';
        if (payload.status === 'downloading') {
          status.textContent = `Atualizando para a versão ${payload.version}...`;
          action.textContent = 'Baixando atualização...';
          action.disabled = true;
          progress.hidden = false;
        }
        if (payload.status === 'progress') {
          progress.value = payload.percent;
          status.textContent = `Baixando atualização... ${payload.percent}%`;
        }
        if (payload.status === 'downloaded') {
          status.textContent = `Versão ${payload.version} pronta para instalar.`;
          action.textContent = 'Reiniciar e instalar';
          action.disabled = false;
          action.onclick = () => window.launcherApi.install();
          progress.hidden = true;
        }
        if (payload.status === 'ready') setReady('Jogo atualizado e pronto para iniciar.');
        if (payload.status === 'offline') setReady('Não foi possível verificar agora. Você pode entrar offline.');
        if (payload.status === 'error') setReady('A atualização falhou. Você pode tentar novamente depois.');
      });
    </script>
  </body>
</html>
